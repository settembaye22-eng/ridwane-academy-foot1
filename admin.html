
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration | Ridwane Academy Foot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo-raf.jpg">
  <style>
    .admin-login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #151515;
      padding: 20px;
    }

    .admin-card {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 14px;
      border-top: 6px solid #d71920;
    }

    .admin-card img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto 20px;
    }

    .admin-card h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .admin-card p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .admin-card label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }

    .admin-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 7px;
    }

    .admin-card button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #d71920;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    #login-message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <section class="admin-login">
    <div class="admin-card">

      <img src="assets/logo-raf.jpg" alt="Logo RAF">

      <h1>Administration RAF</h1>
      <p>Espace réservé à l'administrateur</p>

      <form id="admin-login-form">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" required>

        <button type="submit">Se connecter</button>

        <p id="login-message" role="status"></p>
      </form>

    </div>
  </section>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
